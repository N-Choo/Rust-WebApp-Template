<div
  class="card"
  style="
    max-width: 600px;
    margin: 20px auto;
    padding: 30px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
  "
>
  <h2 style="text-align: center; color: #333">Edit Your Profile</h2>
  <p style="text-align: center; color: #777; font-size: 0.9rem">
    Update your information in Microsoft Entra ID
  </p>

  <form
    id="profileForm"
    style="
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
    "
  >
    <div
      style="
        grid-column: span 2;
        background: #f8f9fa;
        padding: 10px;
        border-radius: 6px;
      "
    >
      <label style="font-size: 0.8rem; color: #888"
        >Account ID (Read-only)</label
      >
      <div
        id="id"
        style="font-family: monospace; font-size: 0.8rem; color: #555"
      >
        Loading...
      </div>
    </div>

    <div>
      <label>Display Name</label>
      <input type="text" id="displayName" />
    </div>
    <div>
      <label>Email (Read-only)</label>
      <input
        type="text"
        id="mail"
        disabled
        style="background: #f1f3f5; cursor: not-allowed; color: #adb5bd"
      />
    </div>
    <div>
      <label>Given Name</label>
      <input type="text" id="givenName" />
    </div>
    <div>
      <label>Surname</label>
      <input type="text" id="surname" />
    </div>
    <div>
      <label>Job Title</label>
      <input type="text" id="jobTitle" />
    </div>
    <div>
      <label>Mobile Phone</label>
      <input type="text" id="mobilePhone" />
    </div>
    <div>
      <label>Office Location</label>
      <input type="text" id="officeLocation" />
    </div>
    <div>
      <label>Preferred Language</label>
      <input type="text" id="preferredLanguage" placeholder="en-US" />
    </div>
    <div style="grid-column: span 2">
      <label>Business Phone</label>
      <input type="text" id="businessPhone" placeholder="Primary work phone" />
    </div>

    <div style="grid-column: span 2; text-align: center; margin-top: 10px">
      <button
        type="submit"
        id="saveBtn"
        style="width: 100%; padding: 12px; background: #28a745"
      >
        Save Changes
      </button>
      <button
        type="button"
        data-nav="/"
        style="
          background: none;
          color: #666;
          border: none;
          margin-top: 10px;
          cursor: pointer;
        "
      >
        Cancel
      </button>
    </div>
  </form>
  <div
    id="status"
    style="text-align: center; margin-top: 15px; font-weight: bold"
  ></div>
</div>

<style>
  #profileForm label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: #555;
    margin-bottom: 5px;
  }
  #profileForm input {
    width: 100%;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
    box-sizing: border-box;
  }
</style>
